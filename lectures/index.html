<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محاضرات مواد قسم تكنولوجيا الطوارئ والرعاية الحرجة</title>
<meta name="description" content="تجميع محاضرات مواد قسم تكنولوجيا الطوارئ والرعاية الحرجة — جامعة الدلتا.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4F6F9">
<link rel="icon" type="image/png" href="../assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#0062B0;--brand-700:#0A4783;--brand-soft:#E7F0FA;--navy:#0B2545;
  --accent:#F26722;--accent-600:#DC5714;--accent-soft:#FDEDE2;
  --bg:#F4F6F9;--surface:#fff;--surface-2:#F7F9FC;--line:#E3E9F0;--line-2:#CED7E2;
  --ink:#0F1E33;--ink-2:#33445A;--muted:#64748B;--faint:#97A3B4;
  --ok:#15803D;--ok-soft:#E6F4EA;--bad:#C2413A;--bad-soft:#FDECEB;
  --font:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
.ltr{direction:ltr;unicode-bidi:isolate}
.mono{font-family:var(--mono)}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:12px}
.top img{width:40px;height:40px}
.top h1{font-size:18px;line-height:1.35;font-weight:700;color:var(--navy)}
.top small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3}
main{max-width:1040px;margin:0 auto;padding:24px 20px 60px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2);border-color:var(--faint)}
.btn:focus-visible,.course:focus-visible,.seg button:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--brand-700)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.accent:hover{background:var(--accent-600)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:34px;padding:0 11px;font-size:13.5px;border-radius:9px}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;border:1px solid transparent;background:none;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--bad-soft);color:var(--bad)}

.head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.head h2{font-size:22px;color:var(--navy)}
.head p{color:var(--muted)}
.search{margin-inline-start:auto;position:relative}
.search input{height:42px;width:250px;font-size:16px;max-width:100%;border:1px solid var(--line-2);border-radius:11px;padding:0 38px 0 12px;background:var(--surface)}
.search input:focus{outline:2px solid var(--brand);outline-offset:1px}
.search .ico{position:absolute;inset-inline-start:12px;top:12px;color:var(--faint)}

.level{margin:26px 0 10px;font-size:14px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:10px}
.level::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.course{display:flex;align-items:center;gap:12px;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.course:hover{border-color:var(--brand);box-shadow:0 6px 18px -10px rgba(0,98,176,.45)}
.course .code{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--brand);background:var(--brand-soft);border-radius:7px;padding:3px 7px;flex:none}
.course .name{flex:1;font-weight:500;line-height:1.35;font-size:14.5px;text-align:left}
.count{flex:none;min-width:30px;height:26px;padding:0 8px;border-radius:13px;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--surface-2);color:var(--faint);border:1px solid var(--line)}
.count.has{background:var(--ok-soft);color:var(--ok);border-color:transparent}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.card h3{font-size:16.5px;color:var(--navy)}
.card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.card-head .acts{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.crumb{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.crumb .title{font-size:20px;font-weight:700;color:var(--navy);text-align:left}
.crumb .code{font-family:var(--mono);font-weight:600;color:var(--brand);background:var(--brand-soft);border-radius:8px;padding:4px 9px;font-size:14px}

.drop{border:2px dashed var(--line-2);border-radius:14px;padding:26px 16px;text-align:center;background:var(--surface-2);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop .ico{width:30px;height:30px;color:var(--brand);margin:0 auto 6px;display:block}
.drop b{display:block;font-weight:600}
.drop span{color:var(--muted);font-size:13.5px}

.mode{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
.mode>b{font-weight:600}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line-2);border-radius:11px;padding:3px}
.seg button{border:0;background:none;min-height:36px;padding:0 14px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--brand);color:#fff}
.hint{color:var(--muted);font-size:13.5px;margin-top:8px}

.rows{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.badge{flex:none;width:44px;height:30px;border-radius:7px;display:grid;place-items:center;font-family:var(--mono);font-size:11.5px;font-weight:600;color:#fff;background:var(--muted)}
.badge.slides{background:#C8502B}.badge.pdf{background:#B3261E}.badge.doc{background:#2B5FB3}
.row .info{flex:1;min-width:0}
.row .fname{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.row .meta{color:var(--muted);font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{background:var(--ok-soft);color:var(--ok);border-radius:6px;padding:0 7px;font-weight:500}
.row .acts{display:flex;gap:6px;flex:none;align-items:center}
.row.err{border-color:#F1C4C0;background:var(--bad-soft)}
.row.ok{border-color:#BFE3CB}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .25s}
.save-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
.save-line .note{color:var(--muted);font-size:13.5px}

.empty{text-align:center;color:var(--muted);padding:26px 10px}
.spin{width:18px;height:18px;border-radius:50%;border:2.2px solid rgba(0,98,176,.18);border-top-color:var(--brand);animation:spin .75s linear infinite;display:inline-block;flex:none;vertical-align:middle}
.spin.light{border-color:rgba(255,255,255,.35);border-top-color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.banner{border-radius:12px;padding:11px 14px;margin-bottom:14px;background:var(--bad-soft);color:var(--bad);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.status{border-radius:12px;padding:11px 14px;margin-bottom:14px;background:var(--brand-soft);color:var(--brand-700);display:flex;gap:10px;align-items:center}
#toasts{position:fixed;bottom:20px;inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:9}
.toast{background:var(--navy);color:#fff;border-radius:11px;padding:10px 16px;box-shadow:0 12px 30px -12px rgba(11,37,69,.6);max-width:92vw}
.toast.bad{background:var(--bad)}
footer{text-align:center;color:var(--faint);font-size:12.5px;padding:0 20px 28px}
.drop b span{color:inherit;font-size:inherit}
.drop .narrow{display:none}
@media (max-width:640px){
  main{padding:16px 16px 40px}
  .top-in{padding:12px 16px}
  .head h2{font-size:20px}
  .row{flex-wrap:wrap}.row .acts{width:100%;justify-content:flex-end}
  .row .acts .btn.sm{min-height:40px;padding:0 14px}
  .icon-btn{width:40px;height:40px}
  .search{margin-inline-start:0;width:100%}.search input{width:100%;height:46px}
  .card{padding:16px}
  .card-head .acts{width:100%;margin-inline-start:0}
  .card-head .acts .btn{flex:1;min-height:44px}
  .crumb .title{font-size:18px;width:100%}
  .mode{gap:8px}.seg{width:100%}.seg button{flex:1;min-height:42px}
  .save-line .btn.accent{width:100%;min-height:48px}
  .drop{padding:22px 14px}
  .drop .wide{display:none}.drop .narrow{display:inline}
  .course{padding:14px}
  #toasts{bottom:calc(16px + env(safe-area-inset-bottom));padding:0 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.spin{animation-duration:2s}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5"/><path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5"/><path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 4h11l3 3v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
</svg>

<header class="top"><div class="top-in">
  <img src="../assets/img/emblem.png" alt="">
  <div><h1>محاضرات مواد قسم تكنولوجيا الطوارئ والرعاية الحرجة</h1><small>كلية العلوم الصحية التطبيقية · جامعة الدلتا</small></div>
</div></header>
<main id="app"></main>
<footer>تصميم: يوسف محروس المعداوي</footer>
<div id="toasts" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<script type="module">
import { CATALOG } from '../assets/js/catalog.js';

/* Where the files live: the Google Apps Script web app (owner's Google Drive). */
const API_URL = 'https://script.google.com/macros/s/AKfycbxTrGhTwRY81beuJFjAtN0oSpCsE5OGoZQfcXbGGDeyLwc2ugzUXadQ6qkBdv5GpcBR/exec';
const params = new URLSearchParams(location.search);
const LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
const ENDPOINT = (LOCAL && params.get('api')) || API_URL;      // ?api=... only honoured on localhost (testing)

const KINDS = { pptx: 'slides', ppt: 'slides', ppsx: 'slides', pps: 'slides', docx: 'doc', doc: 'doc', pdf: 'pdf' };
const MAX_FILE = 300 * 1024 * 1024;
const UP_CHUNK = 4 * 1024 * 1024;      // multiple of 256 KB (Drive resumable upload rule)
const DOWN_CHUNK = 6 * 1024 * 1024;
const LEVEL_NAMES = { 2: 'المستوى الثاني', 3: 'المستوى الثالث', 4: 'المستوى الرابع' };

const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ico = n => `<svg class="ico" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const ext = n => (/\.([A-Za-z0-9]+)$/.exec(n) || [, ''])[1].toLowerCase();
const fmtSize = b => b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
const fmtDate = t => new Date(t).toLocaleDateString('ar-EG', { day: 'numeric', month: 'short', year: 'numeric' });
const natural = (a, b) => a.name.localeCompare(b.name, 'en', { numeric: true, sensitivity: 'base' });
const sleep = ms => new Promise(r => setTimeout(r, ms));

function toast(msg, bad) {
  const t = document.createElement('div');
  t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = msg;
  document.getElementById('toasts').append(t);
  setTimeout(() => t.remove(), bad ? 7000 : 3500);
}

async function call(action, args = {}, timeout = 120000) {
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), timeout);
  let res;
  try {
    // text/plain keeps this a "simple" request (no CORS preflight), which Apps Script requires
    res = await fetch(ENDPOINT, { method: 'POST', redirect: 'follow', signal: ctl.signal, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, args }) });
  } catch (e) {
    throw { error: 'net', message: e.name === 'AbortError' ? 'الخادم اتأخر في الرد، جرّب تاني' : 'تعذّر الاتصال بالخادم — اتأكد من الإنترنت وجرّب تاني' };
  } finally { clearTimeout(tm); }
  let r;
  try { r = await res.json(); } catch (e) { throw { error: 'net', message: 'رد غير متوقع من الخادم (' + res.status + ')' }; }
  if (r && r.ok) return r.data;
  throw (r && r.error) ? r : { error: 'server', message: 'حصل خطأ غير متوقع' };
}
const msgOf = e => (e && e.message) || 'حصل خطأ غير متوقع';

/* ---------------- state ---------------- */
let counts = null;                 // {code: n}
let course = null;                 // catalog item of the open course
let files = [];                    // saved lectures of the open course
let queue = [];                    // [{file, state: 'wait'|'up'|'pdf'|'ok'|'err', pct, note}]
let mode = 'asis';                 // 'asis' | 'pdf'
let busy = false;                  // uploading
let working = '';                  // status line while downloading / converting
let loadError = '';

addEventListener('beforeunload', e => { if (busy) { e.preventDefault(); e.returnValue = ''; } });
addEventListener('hashchange', route);

function route() {
  const code = decodeURIComponent(location.hash.slice(1)).toUpperCase();
  const c = CATALOG.find(x => x.code === code);
  if (busy && course && (!c || c.code !== course.code)) { location.hash = course.code; toast('استنى لما الرفع يخلص', true); return; }
  if (c) openCourse(c); else { course = null; renderHome(); loadCounts(); }
  scrollTo(0, 0);
}

/* ---------------- home ---------------- */
async function loadCounts() {
  try { counts = await call('overview'); loadError = ''; } catch (e) { loadError = msgOf(e); }
  if (!course) renderHome(document.getElementById('q') && document.getElementById('q').value);
}

function renderHome(q = '') {
  const needle = q.trim().toLowerCase();
  const match = c => !needle || c.code.toLowerCase().includes(needle) || c.name.toLowerCase().includes(needle);
  const card = c => {
    const n = counts ? (counts[c.code] || 0) : null;
    return `<button class="course" data-code="${c.code}">
      <span class="code ltr">${c.code}</span><span class="name ltr">${esc(c.name)}</span>
      <span class="count ${n ? 'has' : ''}" title="عدد المحاضرات المحفوظة">${n == null ? '·' : n}</span></button>`;
  };
  const groups = [2, 3, 4].map(l => [LEVEL_NAMES[l], CATALOG.filter(c => c.level === l && !c.elective && match(c))])
    .concat([['مواد اختيارية', CATALOG.filter(c => c.elective && match(c))]]).filter(g => g[1].length);
  const keep = document.activeElement && document.activeElement.id === 'q';
  app.innerHTML = `
    <div class="head">
      <div><h2>اختار المادة</h2><p>افتح المادة وارفع محاضراتها.</p></div>
      <label class="search"><input id="q" type="search" placeholder="بحث باسم المادة أو الكود" value="${esc(q)}" aria-label="بحث">${ico('search')}</label>
    </div>
    ${loadError ? `<div class="banner">${esc(loadError)} <button class="btn sm" id="retry">جرّب تاني</button></div>` : ''}
    ${groups.map(g => `<div class="level">${g[0]}</div><div class="grid">${g[1].map(card).join('')}</div>`).join('') || '<div class="empty">مفيش مادة بالاسم ده</div>'}`;
  const inp = document.getElementById('q');
  inp.oninput = () => renderHome(inp.value);
  if (keep) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  app.querySelectorAll('.course').forEach(b => b.onclick = () => { location.hash = b.dataset.code; });
  const r = document.getElementById('retry'); if (r) r.onclick = () => { loadError = ''; renderHome(inp.value); loadCounts(); };
}

/* ---------------- course ---------------- */
async function openCourse(c) {
  if (course && course.code === c.code) return;
  course = c; files = []; queue = []; working = ''; loadError = '';
  renderCourse(true);
  await refresh();
}

async function refresh() {
  const code = course.code;
  try {
    const list = await call('list', { code });
    if (!course || course.code !== code) return;
    files = list.sort(natural); loadError = '';
    if (counts) counts[code] = files.length;
  } catch (e) { if (course && course.code === code) loadError = msgOf(e); }
  if (course && course.code === code) renderCourse(false);
}

function renderCourse(loading) {
  const waiting = queue.filter(x => x.state === 'wait').length;
  const anyOffice = files.some(f => KINDS[f.ext] !== 'pdf');
  const qRow = (x, i) => `
    <div class="row ${x.state === 'err' ? 'err' : x.state === 'ok' ? 'ok' : ''}">
      <span class="badge ${KINDS[ext(x.file.name)]}">${esc(ext(x.file.name).toUpperCase())}</span>
      <div class="info"><div class="fname ltr" title="${esc(x.file.name)}">${esc(x.file.name)}</div>
        <div class="meta"><span class="ltr">${fmtSize(x.file.size)}</span><span>${esc(
          x.state === 'wait' ? 'جاهز للحفظ' : x.state === 'up' ? 'بيترفع… ' + x.pct + '%' : x.state === 'pdf' ? 'بيتحوّل PDF…' : x.state === 'ok' ? 'اتحفظ' + (x.note ? ' — ' + x.note : '') : x.note)}</span></div>
        ${x.state === 'up' || x.state === 'pdf' ? `<div class="bar"><i style="width:${x.state === 'pdf' ? 100 : x.pct}%"></i></div>` : ''}</div>
      <div class="acts">${x.state === 'wait' && !busy ? `<button class="icon-btn" data-unq="${i}" aria-label="شيل الملف" title="شيل الملف">${ico('x')}</button>` : x.state === 'up' || x.state === 'pdf' ? '<span class="spin"></span>' : ''}</div>
    </div>`;
  const fRow = f => `
    <div class="row">
      <span class="badge ${KINDS[f.ext]}">${esc(f.ext.toUpperCase())}</span>
      <div class="info"><div class="fname ltr" title="${esc(f.name)}">${esc(f.name)}</div>
        <div class="meta"><span class="ltr">${fmtSize(f.size)}</span><span>${fmtDate(f.at)}</span>${KINDS[f.ext] !== 'pdf' && f.pdf ? '<span class="chip">نسخة PDF جاهزة</span>' : ''}</div></div>
      <div class="acts">
        <button class="btn sm" data-dl="${f.id}" ${working ? 'disabled' : ''}>${ico('download')}تحميل</button>
        ${KINDS[f.ext] !== 'pdf' ? `<button class="btn sm" data-dlpdf="${f.id}" ${working ? 'disabled' : ''}>PDF</button>` : ''}
        <button class="icon-btn" data-rm="${f.id}" aria-label="مسح ${esc(f.name)}" title="مسح" ${working || busy ? 'disabled' : ''}>${ico('trash')}</button>
      </div>
    </div>`;
  app.innerHTML = `
    <div class="crumb">
      <button class="btn sm" id="back" ${busy ? 'disabled' : ''}>${ico('back')}كل المواد</button>
      <span class="code ltr">${course.code}</span><span class="title ltr">${esc(course.name)}</span>
    </div>
    ${loadError ? `<div class="banner">${esc(loadError)} <button class="btn sm" id="retry">جرّب تاني</button></div>` : ''}
    <section class="card">
      <div class="card-head"><h3>رفع المحاضرات</h3></div>
      <div class="drop" id="drop" role="button" tabindex="0">
        ${ico('upload')}<b><span class="wide">اسحب كل محاضرات المادة هنا، أو اضغط واختارهم من الجهاز</span><span class="narrow">اضغط هنا واختار كل محاضرات المادة</span></b>
        <span>PowerPoint · PDF · Word — تقدر تختار كذا ملف مرة واحدة</span>
        <input id="pick" type="file" multiple hidden accept=".pptx,.ppt,.ppsx,.pps,.pdf,.docx,.doc">
      </div>
      <div class="mode"><b>طريقة الحفظ:</b>
        <div class="seg" role="group" aria-label="طريقة الحفظ">
          <button data-mode="asis" aria-pressed="${mode === 'asis'}" ${busy ? 'disabled' : ''}>زي ما هي</button>
          <button data-mode="pdf" aria-pressed="${mode === 'pdf'}" ${busy ? 'disabled' : ''}>الكل PDF</button>
        </div>
      </div>
      <p class="hint">${mode === 'asis'
        ? 'الملفات هتتحفظ بنفس نوعها (PowerPoint يفضل PowerPoint، و PDF يفضل PDF).'
        : 'كل ملف PowerPoint أو Word هيتعمله نسخة PDF بنفس شكل الشرايح، والملف الأصلي هيفضل محفوظ معاها.'}</p>
      ${queue.length ? `<div class="rows">${queue.map(qRow).join('')}</div>` : ''}
      ${queue.length ? `<div class="save-line">
        <button class="btn accent" id="save" ${busy || !waiting ? 'disabled' : ''}>${busy ? '<span class="spin light"></span>جاري الحفظ…' : ico('save') + 'حفظ المحاضرات' + (waiting ? ' (' + waiting + ')' : '')}</button>
        ${busy ? '<span class="note">سيب الصفحة مفتوحة لحد ما الرفع يخلص.</span>' : !waiting ? '<button class="btn sm" id="clear">فضّي القائمة</button>' : ''}
      </div>` : ''}
    </section>
    <section class="card">
      <div class="card-head"><h3>المحاضرات المحفوظة${loading ? '' : ' (' + files.length + ')'}</h3>
        ${files.length ? `<div class="acts">
          <button class="btn sm primary" id="all" ${working ? 'disabled' : ''}>${ico('download')}تحميل الكل (زي ما هي)</button>
          <button class="btn sm" id="allpdf" ${working ? 'disabled' : ''}>${ico('download')}تحميل الكل PDF</button>
        </div>` : ''}
      </div>
      ${working ? `<div class="status"><span class="spin"></span><span>${esc(working)}</span></div>` : ''}
      ${loading ? '<div class="empty"><span class="spin"></span></div>'
        : files.length ? `<div class="rows" style="margin-top:0">${files.map(fRow).join('')}</div>${anyOffice ? '<p class="hint">"تحميل الكل PDF" بيحوّل أي ملف PowerPoint أو Word لسه ملوش نسخة PDF قبل التحميل.</p>' : ''}`
        : '<div class="empty">لسه مفيش محاضرات محفوظة للمادة دي.</div>'}
    </section>`;

  const $ = id => document.getElementById(id);
  $('back').onclick = () => { location.hash = ''; };
  if ($('retry')) $('retry').onclick = () => { loadError = ''; renderCourse(true); refresh(); };
  const drop = $('drop'), pick = $('pick');
  drop.onclick = () => { if (!busy) pick.click(); };
  drop.onkeydown = e => { if ((e.key === 'Enter' || e.key === ' ') && !busy) { e.preventDefault(); pick.click(); } };
  pick.onchange = () => addFiles(pick.files);
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); if (!busy) addFiles(e.dataTransfer.files); };
  app.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { mode = b.dataset.mode; renderCourse(false); });
  app.querySelectorAll('[data-unq]').forEach(b => b.onclick = () => { queue.splice(+b.dataset.unq, 1); renderCourse(false); });
  if ($('save')) $('save').onclick = saveAll;
  if ($('clear')) $('clear').onclick = () => { queue = []; renderCourse(false); };
  app.querySelectorAll('[data-dl]').forEach(b => b.onclick = () => downloadOne(b.dataset.dl, false));
  app.querySelectorAll('[data-dlpdf]').forEach(b => b.onclick = () => downloadOne(b.dataset.dlpdf, true));
  app.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => removeFile(b.dataset.rm));
  if ($('all')) $('all').onclick = () => downloadAll(false);
  if ($('allpdf')) $('allpdf').onclick = () => downloadAll(true);
}

function addFiles(list) {
  let skipped = 0;
  queue = queue.filter(x => x.state === 'wait' || x.state === 'err');
  for (const file of Array.from(list)) {
    if (!KINDS[ext(file.name)] || !file.size || file.size > MAX_FILE) { skipped++; continue; }
    queue = queue.filter(x => x.file.name !== file.name);
    queue.push({ file, state: 'wait', pct: 0, note: '' });
  }
  queue.forEach(x => { if (x.state === 'err') { x.state = 'wait'; x.note = ''; } });
  queue.sort((a, b) => natural(a.file, b.file));
  if (skipped) toast(skipped + ' ملف اتشال: المسموح PowerPoint و PDF و Word لحد 300 ميجا', true);
  renderCourse(false);
}

/* ---------------- upload ---------------- */
const toB64 = blob => new Promise((ok, no) => {
  const r = new FileReader();
  r.onload = () => ok(String(r.result).slice(String(r.result).indexOf(',') + 1));
  r.onerror = () => no({ error: 'file', message: 'تعذّرت قراءة الملف من الجهاز' });
  r.readAsDataURL(blob);
});

async function uploadFile(code, item) {
  const file = item.file;
  const { uploadId } = await call('start', { code, name: file.name, size: file.size });
  let off = 0, fails = 0;
  while (true) {
    let r;
    try {
      r = await call('chunk', { uploadId, offset: off, data: await toB64(file.slice(off, off + UP_CHUNK)) }, 300000);
      fails = 0;
    } catch (e) {
      if (e.error === 'missing' || e.error === 'input' || e.error === 'file' || ++fails > 4) throw e;
      await sleep(1500 * fails);
      try { r = await call('chunk', { uploadId }); } catch (e2) { if (e2.error === 'missing') throw e2; continue; }   // ask Drive where to resume
    }
    if (r.done) return r.file;
    off = r.next;
    item.pct = Math.min(99, Math.round(off / file.size * 100));
    renderCourse(false);
  }
}

async function saveAll() {
  if (busy) return;
  const code = course.code, toPdf = mode === 'pdf';
  busy = true;
  let ok = 0, bad = 0;
  for (const item of queue.filter(x => x.state === 'wait')) {
    item.state = 'up'; item.pct = 0; renderCourse(false);
    try {
      const saved = await uploadFile(code, item);
      files = files.filter(f => f.name !== saved.name).concat(saved).sort(natural);
      if (toPdf && !saved.pdf) {
        item.state = 'pdf'; renderCourse(false);
        try { saved.pdf = await call('convert', { id: saved.id }, 400000); }
        catch (e) { item.note = 'الأصل اتحفظ، بس التحويل لـ PDF فشل: ' + msgOf(e); }
      }
      item.state = 'ok'; ok++;
    } catch (e) { item.state = 'err'; item.note = msgOf(e); bad++; }
    renderCourse(false);
  }
  busy = false;
  if (counts) counts[code] = files.length;
  toast(bad ? `اتحفظ ${ok} وفشل ${bad} — اضغط "حفظ" تاني بعد ما تضيف اللي فشل` : `تم حفظ ${ok} محاضرة`, !!bad);
  queue = queue.filter(x => x.state !== 'ok' || x.note);
  await refresh();
}

/* ---------------- download ---------------- */
async function fetchBlob(id, size, onPart) {
  const parts = [];
  for (let off = 0; off < size || !parts.length;) {
    let r, fails = 0;
    while (true) {
      try { r = await call('read', { id, offset: off, length: DOWN_CHUNK }, 300000); break; }
      catch (e) { if (e.error !== 'net' || ++fails > 3) throw e; await sleep(1500 * fails); }
    }
    if (!r.data) break;
    const bin = atob(r.data), buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    parts.push(buf); off += buf.length;
    if (onPart) onPart(Math.min(100, Math.round(off / size * 100)));
  }
  return new Blob(parts);
}

function saveBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}

const pdfName = f => KINDS[f.ext] === 'pdf' ? f.name : f.name.replace(/\.[^.]+$/, '') + '.pdf';
const say = t => { working = t; renderCourse(false); };

async function ensurePdf(f) {
  if (f.pdf) return f.pdf;
  f.pdf = await call('convert', { id: f.id }, 400000);
  return f.pdf;
}

async function downloadOne(id, asPdf) {
  const f = files.find(x => x.id === id);
  if (!f || working) return;
  try {
    let src = { id: f.id, size: f.size }, name = f.name;
    if (asPdf) { if (!f.pdf) say('بيتحوّل PDF: ' + f.name); src = await ensurePdf(f); name = pdfName(f); }
    say('بيتحمّل: ' + name);
    const blob = await fetchBlob(src.id, src.size, p => say('بيتحمّل: ' + name + ' — ' + p + '%'));
    saveBlob(blob, name);
  } catch (e) { toast(msgOf(e), true); }
  working = ''; renderCourse(false);
}

async function downloadAll(asPdf) {
  if (working || !files.length) return;
  const code = course.code, failed = [];
  try {
    const zip = new JSZip();
    let i = 0;
    for (const f of files) {
      i++;
      try {
        let src = { id: f.id, size: f.size }, name = f.name;
        if (asPdf) { if (!f.pdf) say(`(${i}/${files.length}) بيتحوّل PDF: ${f.name}`); src = await ensurePdf(f); name = pdfName(f); }
        say(`(${i}/${files.length}) بيتحمّل: ${name}`);
        const blob = await fetchBlob(src.id, src.size, p => say(`(${i}/${files.length}) بيتحمّل: ${name} — ${p}%`));
        zip.file(name, blob, { binary: true });
      } catch (e) { failed.push(f.name + ' — ' + msgOf(e)); }
    }
    if (Object.keys(zip.files).length) {
      say('بيتجمّع ملف واحد…');
      const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
      saveBlob(blob, code + (asPdf ? ' - lectures (PDF).zip' : ' - lectures.zip'));
    }
    if (failed.length) toast('ملفات ماتحمّلتش: ' + failed.join(' ؛ '), true);
  } catch (e) { toast(msgOf(e), true); }
  working = ''; renderCourse(false);
}

async function removeFile(id) {
  const f = files.find(x => x.id === id);
  if (!f || !confirm('تمسح "' + f.name + '"؟')) return;
  say('بيتمسح: ' + f.name);
  try {
    await call('remove', { id });
    files = files.filter(x => x.id !== id);
    if (counts) counts[course.code] = files.length;
  } catch (e) { toast(msgOf(e), true); }
  working = ''; renderCourse(false);
}

route();
</script>
